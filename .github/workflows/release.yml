name: Build & Attach Release Artifact

on:
  release:
    types: [published]   # Fires when a release is published (not draft)

permissions:
  contents: write        # Needed to upload release assets

env:
  # Pin the exact MelonLoader the game is tested against (matches the version
  # the mod references: net35). Bump this when you update MelonLoader in-game.
  MELONLOADER_VERSION: v0.7.3

jobs:
  build:
    name: Build RestoryQOL for release ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      # ── 2. Set up .NET ──────────────────────────────────────────────────────
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      # ── 3. Cache NuGet packages ─────────────────────────────────────────────
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      # ── 4. Build StubGenerator ───────────────────────────────────────────────
      - name: Build StubGenerator
        run: dotnet build tools/StubGenerator/StubGenerator.csproj -c Release -o tools/StubGenerator/out

      # ── 5. Set up stub game layout ───────────────────────────────────────────
      - name: Set up stub game layout
        run: |
          GAME_PATH="$GITHUB_WORKSPACE/libs/game"
          mkdir -p "$GAME_PATH/Restory_Data/Managed"
          mkdir -p "$GAME_PATH/MelonLoader/net35"
          mkdir -p "$GAME_PATH/Mods"
          for dll in libs/Managed/*.dll; do
            ln -f "$dll" "$GAME_PATH/Restory_Data/Managed/$(basename $dll)"
          done
          for dll in libs/MelonLoader/*.dll; do
            ln -f "$dll" "$GAME_PATH/MelonLoader/net35/$(basename $dll)"
          done
          cat > Directory.Build.props << EOF
          <Project>
            <PropertyGroup>
              <GamePath>$GAME_PATH</GamePath>
            </PropertyGroup>
          </Project>
          EOF

      # ── 6. Build the mod ─────────────────────────────────────────────────────
      - name: Build RestoryQOL (Release)
        run: dotnet build RestoryQOL.csproj -c Release -o build/output

      # ── 7. Assemble the full override archive (MelonLoader built in) ────────
      #
      # The "override" zip is a drop-in overlay for the game root:
      #   version.dll                       <- the loader bootstrap
      #   MelonLoader/                      <- full MelonLoader runtime
      #   Mods/RestoryQOL.dll               <- the mod
      # A user extracts it over <GamePath> and the game is modded — no separate
      # MelonLoader installation needed.
      - name: Download & extract MelonLoader
        run: |
          ML_URL="https://github.com/LavaGang/MelonLoader/releases/download/${MELONLOADER_VERSION}/MelonLoader.x64.zip"
          echo "Downloading ${ML_URL}"
          curl -fsSL -o /tmp/MelonLoader.zip "$ML_URL"
          mkdir -p staging
          unzip -o -q /tmp/MelonLoader.zip -d staging
          echo "Populated:"
          ls staging

      - name: Assemble overlay
        run: |
          OVERLAY="$GITHUB_WORKSPACE/overlay"
          mkdir -p "$OVERLAY/Mods"
          # Bring in the mod (and its Debug symbols if present)
          cp build/output/RestoryQOL.dll "$OVERLAY/Mods/RestoryQOL.dll"
          if [ -f "build/output/RestoryQOL.pdb" ]; then
            cp build/output/RestoryQOL.pdb "$OVERLAY/Mods/RestoryQOL.pdb"
          fi
          cp README.md "$OVERLAY/README.md" || true
          # Merge the MelonLoader layout in
          cp -r staging/* "$OVERLAY/"
          echo "Overlay contents:"
          find "$OVERLAY" -maxdepth 2 | sort

      - name: Package override archive
        run: |
          TAG="${{ github.event.release.tag_name }}"
          ARCHIVE="RestoryQOL-${TAG}-full-override.zip"
          ( cd overlay && zip -r "../${ARCHIVE}" . )
          ls -la "$ARCHIVE"
          echo "ARCHIVE=${GITHUB_WORKSPACE}/${ARCHIVE}" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${ARCHIVE}" >> $GITHUB_ENV

      # ── 8. Upload artifacts to the GitHub release ────────────────────────────
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" \
            build/output/RestoryQOL.dll#RestoryQOL.dll \
            "$ARCHIVE" \
            --clobber